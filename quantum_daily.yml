on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install anthropic supabase slack-sdk openpyxl
      - name: Check secrets
        run: |
          python - <<'PYEOF'
          import os, sys
          missing = [k for k in ["ANTHROPIC_API_KEY","SUPABASE_URL","SUPABASE_KEY","SLACK_BOT_TOKEN"] if not os.environ.get(k)]
          if missing:
              print("ERROR:", missing)
              sys.exit(1)
          print("All secrets OK")
          PYEOF
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      - name: Run
        run: python quantum_daily.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: CA4N4ETA7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quantum-report-${{ github.run_number }}
          path: quantum_computers_*.xlsx
          retention-days: 30
          if-no-files-found: ignore
